name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: |
          find htdocs plib -name '*.php' -print0 | xargs -0 -n1 php -l
          find plib -name '*.phtml' -print0 | xargs -0 -n1 php -l
      - name: PHP scan controller smoke test
        run: php tests/php_scan_controller_smoke.php
      - name: Python tests
        run: sudo "$(command -v python3)" -m unittest discover -s tests -v
      - name: Plesk updater controller smoke test
        run: php tests/plesk_updater_smoke.php
      - name: Build ZIP
        run: python3 tools/build_release.py
