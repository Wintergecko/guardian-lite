name: Publish Guardian Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: |
          find htdocs plib -name '*.php' -print0 | xargs -0 -n1 php -l
          find plib -name '*.phtml' -print0 | xargs -0 -n1 php -l
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release and enforce matching tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/build_release.py --tag "$RELEASE_TAG"
      - name: Publish ZIP + SHA256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "Guardian Lite $RELEASE_TAG"
