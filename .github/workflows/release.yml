name: Publish Guardian Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: |
          find htdocs plib -name '*.php' -print0 | xargs -0 -n1 php -l
          find plib -name '*.phtml' -print0 | xargs -0 -n1 php -l
      - name: PHP scan controller smoke test
        run: php tests/php_scan_controller_smoke.php
      - name: Python tests
        run: sudo "$(command -v python3)" -m unittest discover -s tests -v
      - name: Plesk updater controller smoke test
        run: php tests/plesk_updater_smoke.php
      - name: Build release and verify version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('meta.xml').getroot().findtext('version'))")
          TAG="v${VERSION}"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "::error::Tag and meta.xml version differ"
            exit 1
          fi
          python3 tools/build_release.py --tag "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create version tag when started manually
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Refusing to overwrite it."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${GITHUB_SHA}"
      - name: Publish ZIP + SHA256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag --generate-notes --title "Guardian Lite $RELEASE_TAG"
