# Guardian Lite experimental ModSecurity v2 rules: 120 req/min/IP, HTTP 429.
# Intended only for a test domain AFTER testing CRS integration, real-IP config,
# ModSecurity audit logs and persistent IP collections; never include globally blind.
# Rules require SecDataDir / writable persistent collections; otherwise counters may fail.
# IDs are deliberately in private range; check for collisions before activation.
SecAction "id:9974000,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
SecAction "id:9974001,phase:1,pass,nolog,setvar:ip.guardian_req_counter=+1,expirevar:ip.guardian_req_counter=60"
SecRule IP:guardian_req_counter "@gt 120" "id:9974002,phase:1,deny,status:429,log,msg:'Guardian Lite HTTP rate limit exceeded'"
